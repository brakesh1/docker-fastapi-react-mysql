services:

  db:
    image: mysql:8.0

    container_name: broker-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - broker-network


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend

    container_name: broker-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    networks:
      - broker-network


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend

    container_name: broker-frontend

    restart: unless-stopped

    expose:
      - "80"

    networks:
      - broker-network


  nginx:
    image: nginx:alpine

    container_name: broker-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend

    networks:
      - broker-network


volumes:
  mysql_data:


networks:
  broker-network:
    driver: bridge
